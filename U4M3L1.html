<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset ="utf-8">
		<title>CSS Selectors</title>
		
		<style>
			#target	{
				color: red;
			}
		* {
		 text-decoration: underline;
		
		}
			.blue{
				color: blue;
			}
			
		h2 {
		color: orange;
		}
		</style>
	</head>
	
	<body>
		<section>
		   <h2> This is orange</h2>
			<h1> This is my H1</h1>
			<p id="target">This is my section</p>
			<p> This is my second p</p>
		</section>
		<section>
			<h1 class="blue"> this is my H1 </h1>
			<p> This is my section </p>
			<pclass="blue">This is my second p</p>
		</section>
	</body>
</html>
