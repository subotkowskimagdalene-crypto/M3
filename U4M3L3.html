<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset ="utf-8">
		<title>CSS Relational Selectors</title>
		
		<style>
			p.red{
				color: red;
			}
		</style>
		
		<style>
			h1,h2{
				color: blue;
			}
		</style>
		<style>
			h2.bold, h3{
				font-weight: bold;
			}
		</style>
		
	</head>
	
	<body>
		<p class="red">the p that will be red</p>
		
		<p>p not targetted</p>
		<h1>H1 multiple selector</h1>
		<h2>H2 multiple selector</h2>
		<h2 class="bold">h2 multiple selector</h2>
		<h3>H3 multiple selectors</h3>
	</body>
</html>
