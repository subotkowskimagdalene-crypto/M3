<!DOCTYPE html>
<html lang=”en”>
	<head>
		<meta charset="utf-8">
		<title>Names Font Family and Size</title>
		<style>
				h1{font:normal 700 2em "Times New Roman";}
				h2{font:normal bold 3em "Times New Roman";}
				h3{font:normal nomal 4em "Times New Roman";}
				h4{font:oblique 500 5em "Times New Roman";}
				h5{font:oblique bold 6em "Times New Roman";}
				h6{font:oblique normal 7em "Times New Roman";}
				.f1{font:italic 600 8em "Times New Roman";}
				.f2{font:italic bold 9em "Times New Roman";}
				.f3{font:italic nomal 10em "Times New Roman";}
				.f4{font:11em "Times New Roman";}
		</style>
	</head>

	<body>
		<h1>Lene Subotkowski</h1>
		<h2>Lene Subotkowski</h2>
		<h3>Lene Subotkowski</h3>
		<h4>Lene Subotkowski</h4>
		<h5>Lene Subotkowski</h5>
		<h6>Lene Subotkowski</h6>
		<p class="f1">Lene Subotkowski</p>
		<p class="f2">Lene Subotkowski</p>
		<p class="f3">Lene Subotkowski</p>
		<p class="f4">Lene Subotkowski</p>
	</body>
</html>
