<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CSS Fix</title>
    <style>
        /* Use CSS comments inside style tags */
        h2 {
            color: green; 
        }
    </style>
    <!-- Note: mainCSS.css will override the green style above if it also contains h1 rules -->
    <link rel="stylesheet" href="mainCSS.css">
</head>
<body>
    <!-- This will stay RED because inline styles have the highest priority -->
    <h1 style="color:red">Hello</h1>

    <!-- These will be GREEN (unless overridden by mainCSS.css) -->
    <p style="font-size:30px">Hello world px</p>
	<p style="font-size:30%">Hello world %</p>
	<p style="font-size:30 em">Hello world em</p>
	<p style="font-size:30 rem">Hello world rem</p>
	<p style="font-size:30 pt">Hello world pt</p>
</body>
</html>
